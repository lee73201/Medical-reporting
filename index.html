<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>医检报告通</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="prototype-shell" aria-label="医检报告通">
      <section class="phone" aria-live="polite">
        <div class="status-bar"><span>医检报告通</span><span class="status-icons">检查记录 · 健康参考</span></div>

        <section class="screen app-screen active" id="overview" data-title="检验概览"></section>
        <section class="screen app-screen" id="upload" data-title="上传报告"></section>
        <section class="screen app-screen" id="reports" data-title="报告列表"></section>
        <section class="screen app-screen" id="report-detail" data-title="报告详情"></section>
        <section class="screen app-screen" id="trends" data-title="趋势分析"></section>
        <section class="screen app-screen" id="ai-insights" data-title="AI 助手"></section>
        <section class="screen app-screen" id="profile" data-title="我的"></section>
        <div id="app-notice" class="app-notice" role="status" hidden></div>

        <nav class="bottom-nav visible" aria-label="底部导航">
          <button data-go="overview"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>首页</span></button>
          <button data-go="reports"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg><span>报告</span></button>
          <button data-go="trends"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-7"/></svg><span>趋势</span></button>
          <button data-go="ai-insights"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7v3a7 7 0 0 0 14 0V9a7 7 0 0 0-7-7zM9 10h.01M15 10h.01M9 15c1.8 1.2 4.2 1.2 6 0"/></svg><span>AI 助手</span></button>
          <button data-go="profile"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg><span>我的</span></button>
        </nav>
      </section>
    </main>
    <script src="/vendor/pdfjs/pdf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
